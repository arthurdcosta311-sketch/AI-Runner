name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: v2.4

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pick latest Xcode 26
        run: |
          ls /Applications | grep Xcode || true
          latest=$(ls -d /Applications/Xcode*app | sort -V | tail -n 1)
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Build app (unsigned, device)
        run: |
          xcodebuild \
            -project "AI Runner.xcodeproj" \
            -scheme "AI Runner" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            build

      - name: Package IPA
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products -type d -name "AI Runner.app" -path "*Release-iphoneos*" | head -n 1)
          echo "App at: $APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qry ../AI-Runner.ipa Payload

      - name: Upload IPA artifact (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: AI-Runner-ipa
          path: AI-Runner.ipa

      - name: Attach IPA to the v2.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Unsigned iPhone build of commit ${{ github.sha }}. Re-sign it with your own Apple ID (AltStore, Sideloadly, TrollStore) to install."
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" AI-Runner.ipa --clobber --repo "${{ github.repository }}"
            gh release edit "$RELEASE_TAG" --title "AI Runner $RELEASE_TAG" --notes "$NOTES" --repo "${{ github.repository }}"
          else
            gh release create "$RELEASE_TAG" \
              "AI-Runner.ipa#AI-Runner-$RELEASE_TAG.ipa" \
              --title "AI Runner $RELEASE_TAG" \
              --notes "$NOTES" \
              --latest \
              --target "${{ github.sha }}" \
              --repo "${{ github.repository }}"
          fi
